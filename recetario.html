<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Médico Compacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { padding: 0; margin: 0; }
            .page { box-shadow: none; margin: 0; }
        }
        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 5mm auto;
            background: white;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recipe-section {
            flex: 1;
            border: 2px solid #06b6d4;
            border-radius: 10px;
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .watermark-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 250px;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 p-2">

    <script>
        const logoUrl = "https://github.com/G-Vestige/caduceo/blob/main/caduceo.jpg?raw=true";

        function renderSection() {
            return `
            <img src="${logoUrl}" class="watermark-center" alt="Marca de agua">
            
            <header class="z-10 relative flex items-center">
                <!-- Icono independiente -->
                <div class="p-1">
                    <img src="${logoUrl}" class="w-14 h-14 object-cover rounded-tl-2xl rounded-br-2xl border-2 border-cyan-600 shadow-sm" alt="Logo">
                </div>
                <!-- Bloque azul a la derecha -->
                <div class="bg-cyan-600 text-white p-3 ml-2 rounded-l-2xl rounded-tr-2xl shadow-md flex-grow flex justify-between items-center">
                    <div>
                        <h1 class="text-sm font-bold leading-tight">Dra. S. Lisbeth Rodríguez</h1>
                        <p class="text-[8px] font-semibold uppercase tracking-wide">Médico General</p>
                        <p class="text-[7px] opacity-90">MPPS: 150.416 | RIF: 117935934-7</p>
                    </div>
                    <div class="text-right text-[7px] opacity-90 leading-tight">
                        <p>LR2317957@GMAIL.COM</p>
                        <p class="font-bold text-[8px]">TEL: 0424-1435198</p>
                    </div>
                </div>
            </header>

            <div class="my-2 space-y-1 z-10 relative">
                <input type="text" placeholder="NOMBRE Y APELLIDO:" class="w-full border-b border-gray-300 outline-none p-1 text-[10px] bg-transparent font-medium">
                <div class="flex gap-2">
                    <input type="text" placeholder="EDAD:" class="w-1/2 border-b border-gray-300 outline-none p-1 text-[10px] bg-transparent">
                    <input type="text" placeholder="CÉDULA:" class="w-1/2 border-b border-gray-300 outline-none p-1 text-[10px] bg-transparent">
                </div>
            </div>

            <div class="flex-grow z-10 relative mt-1">
                <h2 class="text-center font-bold text-cyan-700 text-[10px] mb-1 uppercase tracking-wider">INDICACIONES MÉDICAS</h2>
                <textarea class="w-full h-96 resize-none outline-none text-[10px] border border-gray-200 rounded-md p-2 bg-gray-50/50"></textarea>
            </div>

            <footer class="bg-pink-400 text-white text-center py-1 rounded-md font-bold text-[7px] uppercase mt-2 shadow-sm z-10 relative">
                Prevenir una enfermedad es la base de una salud con mejor estilo de vida
            </footer>
            `;
        }
    </script>

    <div class="page border border-gray-200 shadow-xl">
        <script>
            document.write('<div class="recipe-section">' + renderSection() + '</div>');
            document.write('<div class="recipe-section">' + renderSection() + '</div>');
        </script>
    </div>

    <div class="no-print text-center mt-4">
        <button onclick="window.print()" class="bg-cyan-600 text-white px-6 py-2 rounded-full hover:bg-cyan-700 transition shadow-lg font-bold text-sm">
            Imprimir Recetario
        </button>
    </div>

</body>
</html>
