<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Médico - Dra. Lisbeth Rodríguez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { padding: 0; margin: 0; }
            .page { box-shadow: none; margin: 0; }
        }
        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 10mm auto;
            background: white;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .recipe-section {
            flex: 1;
            border: 3px solid #06b6d4;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .watermark-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <script>
        const logoUrl = "https://github.com/G-Vestige/caduceo/blob/main/caduceo.jpg?raw=true";

        function renderSection() {
            return `
            <img src="${logoUrl}" class="watermark-center" alt="Marca de agua">
            
            <header class="bg-cyan-600 text-white p-6 rounded-xl flex justify-between items-center shadow-lg z-10 relative">
                <div class="flex items-center gap-6">
                    <img src="${logoUrl}" class="w-20 h-20 object-cover bg-white rounded-xl border-2 border-white shadow-md" alt="Logo Caduceo">
                    <div>
                        <h1 class="text-3xl font-bold">Dra. S. Lisbeth Rodríguez</h1>
                        <p class="text-lg font-semibold uppercase tracking-wide">Médico General</p>
                        <p class="text-sm opacity-90">MPPS: 150.416 | RIF: 117935934-7</p>
                    </div>
                </div>
                <div class="text-right text-sm opacity-90 leading-relaxed">
                    <p>LR2317957@GMAIL.COM</p>
                    <p class="font-bold text-base">TEL: 0424-1435198</p>
                </div>
            </header>

            <div class="my-8 space-y-5 z-10 relative">
                <input type="text" placeholder="NOMBRE Y APELLIDO:" class="w-full border-b-2 border-gray-400 outline-none p-3 text-lg bg-transparent font-medium">
                <div class="flex gap-8">
                    <input type="text" placeholder="EDAD:" class="w-1/2 border-b-2 border-gray-400 outline-none p-3 text-lg bg-transparent">
                    <input type="text" placeholder="CÉDULA:" class="w-1/2 border-b-2 border-gray-400 outline-none p-3 text-lg bg-transparent">
                </div>
            </div>

            <div class="flex-grow z-10 relative">
                <h2 class="font-bold text-cyan-700 text-xl mb-4 uppercase tracking-wider">Indicaciones Médicas</h2>
                <textarea class="w-full h-56 resize-none outline-none text-base border-2 border-gray-200 rounded-xl p-6 bg-gray-50/50"></textarea>
            </div>

            <footer class="bg-pink-400 text-white text-center py-4 rounded-xl font-bold text-xs uppercase mt-6 shadow-md z-10 relative">
                Prevenir una enfermedad es la base de una salud con mejor estilo de vida
            </footer>
            `;
        }
    </script>

    <div class="page border border-gray-300 shadow-2xl">
        <script>
            document.write('<div class="recipe-section">' + renderSection() + '</div>');
            document.write('<div class="recipe-section">' + renderSection() + '</div>');
        </script>
    </div>

    <div class="no-print text-center mt-8">
        <button onclick="window.print()" class="bg-cyan-600 text-white px-12 py-5 rounded-full hover:bg-cyan-700 transition shadow-xl font-bold text-xl">
            Imprimir Recetario
        </button>
    </div>

</body>
</html>
